[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-exporter"
version = "0.2.7"
description = "从 SteamOS / Steam 游戏录制中导出剪辑与录像（无损或压缩）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "deck" }]
keywords = ["steam", "steamos", "steam-deck", "recording", "clip", "ffmpeg"]

[project.scripts]
steamexport = "steam_exporter.cli:main"

[tool.setuptools.packages.find]
include = ["steam_exporter*"]

[tool.setuptools.package-data]
steam_exporter = ["web/*"]
